<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Nasıf Talha Eren</title>
  <desc id="desc">Animated profile header: digital worlds, AI products, creative coding, and mechanical systems.</desc>
  <style>
    .scan{animation:scan 5s cubic-bezier(.76,0,.24,1) infinite alternate}
    .ticker-a{animation:ticker 18s linear infinite}
    .ticker-b{animation:ticker 25s linear infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes scan{from{transform:translateX(0)}to{transform:translateX(1080px)}}
    @keyframes ticker{to{transform:translateX(-600px)}}
    @keyframes pulse{50%{opacity:.25}}
    @media(prefers-reduced-motion:reduce){.scan,.ticker-a,.ticker-b,.pulse{animation:none}}
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#102033" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="name1"><rect x="48" y="105" width="650" height="78"/></clipPath>
    <clipPath id="name2"><rect x="48" y="184" width="650" height="78"/></clipPath>
    <clipPath id="name3"><rect x="48" y="263" width="650" height="78"/></clipPath>
    <clipPath id="tickerTop"><rect x="748" y="92" width="404" height="46" rx="2"/></clipPath>
    <clipPath id="tickerBottom"><rect x="748" y="302" width="404" height="46" rx="2"/></clipPath>
  </defs>

  <rect width="1200" height="460" rx="24" fill="#eef0e8"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#102033" stroke-opacity=".22" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="412" rx="10" fill="url(#grid)" stroke="#102033" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="64" fill="#102033" font-size="12" font-weight="700" letter-spacing="3">PROFILE / TALHAER</text>
    <circle cx="1004" cy="59" r="5" fill="#168ab0" class="pulse"/>
    <text x="1020" y="64" fill="#102033" font-size="11" letter-spacing="2">CURRENTLY BUILDING</text>
    <path d="M48 82H1152" stroke="#102033" stroke-width="2"/>

    <g fill="#102033" font-size="76" font-weight="900" letter-spacing="-5">
      <g clip-path="url(#name1)"><text class="reveal-a" x="44" y="176">NASIF</text></g>
      <g clip-path="url(#name2)"><text class="reveal-b" x="44" y="255">TALHA</text></g>
      <g clip-path="url(#name3)"><text class="reveal-c" x="44" y="334">EREN</text></g>
    </g>

    <rect x="48" y="360" width="620" height="48" fill="#102033"/>
    <text x="66" y="390" fill="#9ae7ff" font-size="13" font-weight="700" letter-spacing="2">CODE × IMAGES × MACHINES</text>

    <path d="M712 92V408" stroke="#102033" stroke-width="2"/>
    <text x="748" y="173" fill="#102033" font-size="34" font-weight="900" letter-spacing="-2">DIGITAL WORLDS</text>
    <text x="748" y="218" fill="#102033" font-size="34" font-weight="900" letter-spacing="-2">AI PRODUCTS</text>
    <text x="748" y="263" fill="#168ab0" font-size="34" font-weight="900" letter-spacing="-2">PHYSICAL FUTURES</text>

    <rect x="748" y="92" width="404" height="46" rx="2" fill="#102033"/>
    <g clip-path="url(#tickerTop)" class="ticker-a" fill="#eef0e8" font-size="11" font-weight="700" letter-spacing="2">
      <text x="766" y="121">GENERATIVE AI · CREATIVE CODING · WORLD SYSTEMS · GENERATIVE AI · CREATIVE CODING · WORLD SYSTEMS ·</text>
      <text x="1366" y="121">GENERATIVE AI · CREATIVE CODING · WORLD SYSTEMS ·</text>
    </g>

    <rect x="748" y="302" width="404" height="46" rx="2" fill="#9ae7ff"/>
    <g clip-path="url(#tickerBottom)" class="ticker-b" fill="#102033" font-size="11" font-weight="700" letter-spacing="2">
      <text x="766" y="331">MECHANICAL ENGINEERING · INTERFACE SYSTEMS · CONTENT WORKFLOWS · MECHANICAL ENGINEERING ·</text>
      <text x="1366" y="331">MECHANICAL ENGINEERING · INTERFACE SYSTEMS ·</text>
    </g>

    <text x="748" y="383" fill="#102033" font-size="12" letter-spacing="1.8">Designing systems between software</text>
    <text x="748" y="404" fill="#102033" font-size="12" letter-spacing="1.8">and the physical world.</text>
  </g>

  <g class="scan">
    <rect x="48" y="82" width="2" height="326" fill="#168ab0"/>
    <rect x="50" y="82" width="28" height="326" fill="#9ae7ff" opacity=".08"/>
  </g>
</svg>
